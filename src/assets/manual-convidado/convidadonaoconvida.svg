<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Máscara de corte para esconder a parte do cartão que fica dentro do envelope -->
    <clipPath id="card-clip">
      <path d="M 0 0 L 200 0 L 200 115 L 160 115 A 8 8 0 0 0 150 108 L 100 155 L 50 108 A 8 8 0 0 0 40 115 L 0 115 Z" />
    </clipPath>
  </defs>
  
  <!-- "fill="none"" deixa todos os elementos transparentes por dentro -->
  <g fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Cartão com Coração -->
    <g clip-path="url(#card-clip)">
      <g transform="rotate(24 100 100)">
        <rect x="55" y="30" width="75" height="130" rx="3" />
        <path d="M 92.5 105
                 C 92.5 105 65 75 65 52
                 C 65 35 80 34 92.5 50
                 C 105 34 120 35 120 52
                 C 120 75 92.5 105 92.5 105 Z" />
      </g>
    </g>

    <!-- Contorno Externo do Envelope -->
    <path d="M 40 115
             A 8 8 0 0 1 50 108
             L 100 155
             L 150 108
             A 8 8 0 0 1 160 115
             L 160 175
             A 12 12 0 0 1 148 187
             L 52 187
             A 12 12 0 0 1 40 175
             Z" />

    <!-- Aba Inferior do Envelope (Sobrepõe os cortes laterais em V) -->
    <path d="M 40 175
             L 100 120
             L 160 175" />
             
  </g>
</svg>
